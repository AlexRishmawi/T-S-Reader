<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T&S Reader</title>
    <link rel="stylesheet" href="popup.css">
</head>
    <body>

        <header>
            <h1>T&S Reader</h1>
            <span class="badge">Powered by Gemini</span>
        </header>
        <!-- 1. IDLE STATE -->
        <div id="state-idle" class="state active">
            <p class="description">Click below to analyze and summarize the Terms of Service or Privacy Policy on the current page.</p>
            <button id="summarize-btn">Summarize Page</button>
        </div>

        <!-- 2. LOADING STATE -->
        <div id="state-loading" class="state">
            <div class="loading-container">
                <div class="spinner"></div>
                <p class="loading-text">Extracting text & analyzing with Gemini...</p>
            </div>
        </div>

        <!-- 3. RESULT STATE -->
        <div id="state-success" class="state">
            <div id="summary-content" class="summary-box"></div>
            <div id="cache-indicator" class="cache-notice" style="display: none;">
                ⚡ <em>Instant summary loaded from cache.</em>
            </div>
        </div>

        <!-- 4. ERROR STATE -->
        <div id="state-error" class="state error-view">
            <div id="error-icon" class="error-badge">⚠️</div>
            <h3 id="error-title" class="error-heading">Something went wrong</h3>
            <p id="error-message" class="error-desc">We were unable to process this page.</p>
            <div class="error-actions">
                <button id="retry-btn" class="btn btn-secondary">Try Again</button>
            </div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
